<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STATE A — single HTML</title>
    <style>
      html { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center;
             background: #FAF8F4; color: #1F1D1A;
             font: 400 16px/1.5 system-ui, sans-serif; }
      main { text-align: center; padding: 48px 24px; }
      h1 { margin: 0; font-size: 22vw; line-height: 0.9; font-weight: 600;
           color: #2A5A73; letter-spacing: -0.04em; }
      p { margin: 16px 0 0; }
      .sub { font-size: 20px; }
      .links { list-style: none; padding: 0; margin: 32px 0 0; display: flex;
               gap: 20px; justify-content: center; flex-wrap: wrap; }
      .links a { color: #2A5A73; }
      .asset { opacity: 0.7; font-size: 14px; display: flex; gap: 10px;
               align-items: center; justify-content: center; }
      .asset img { display: block; }
    </style>
</head>
<body>
  <main>
    <h1>A</h1>
    <p class="sub">STATE A · single HTML</p>
    <p>One self-contained file. The plainest update there is.</p>
  </main>
</body>
</html>
