name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # PostgreSQL and nothing else: the test suite stands up its own stub
    # OIDC provider in-process (see test/helpers/oidc-stub.js) and never
    # touches Caddy or Keycloak. Bringing up the whole product needs both, but
    # this job is not that — do not add them here "for symmetry" with a
    # deployment; the tests do not need them and would only wait for them.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # test/helpers/app.js reads POSTGRES_URL, not DATABASE_URL — an
      # undocumented thirteenth environment variable the test suite needs
      # that the application itself never does (see .env.example and the
      # README's configuration table for the twelve the application reads).
      # The role has to be allowed to CREATE DATABASE: the suite creates and
      # drops handout_test around every test file. The `postgres` superuser
      # the service starts with already can.
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Before the tests: a leaked tracker key or an internal URL is a
      # one-line fix, and finding it after a green suite is finding it late.
      - run: npm run check:refs
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  # The image. `needs: test` is the whole gate: there is no second path to the
  # registry, so an image can only ever exist for a tree that passed the
  # checks above.
  publish:
    needs: test
    # Pushes to main and to a release tag, nothing else. A pull request must
    # not write to the registry, and building every branch would fill it with
    # images nobody pulls.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # arm64 is built under emulation instead of on a second, native runner:
      # nothing in the eight runtime dependencies compiles (they are pure
      # JavaScript), so the emulated work is unpacking tarballs — while the
      # native route costs a job per architecture plus a third to merge the
      # two manifests.
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # ghcr.io/thorque/handout-app for this repository; a fork publishes
          # into its own namespace rather than failing on somebody else's.
          images: ghcr.io/${{ github.repository }}
          # latest=false, because this action would otherwise move `latest` on
          # rules of its own. The raw tag below is the only rule here: a
          # release tag moves `latest`, a commit on main never does.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        # The action uploads a build summary as a workflow artifact, which needs
        # `actions: write`. Granting it would widen this job's permissions — the
        # one that holds the registry credentials — for a summary nobody reads,
        # so the summary goes instead. Without this the build still succeeds and
        # annotates every run with `Failed to FinalizeArtifact … 403`.
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # These carry org.opencontainers.image.source, which is what links
          # the package to this repository, and …image.version, which is where
          # the version stays readable on an image someone already pulled.
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The GitHub Release, in its own job so that `contents: write` stays off the
  # job that holds the registry credentials.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # scripts/release-notes.sh reads back to the previous tag; the
          # default shallow checkout has neither the tags nor the commits.
          fetch-depth: 0
      # gh is pre-installed on the GitHub-hosted runners, so the release needs
      # no third-party action of its own. --notes together with
      # --generate-notes prepends this text to the commit list GitHub builds.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "${GITHUB_REF_NAME#v}" \
            --notes "$(sh scripts/release-notes.sh "$GITHUB_REF_NAME")" \
            --generate-notes
