# Handout, one compose for the local Docker trial, for production with the
# bundled Keycloak, for production against an identity provider you already
# have, and for the development loop (README.md, "Developing"; docs/deployment.md,
# "Three ways to run it"). Nothing is built; the application is pulled from the
# registry at a released version, except in the development loop, which does not
# start it at all.
#
# What differs between them is not in this file but in the env file it is run
# with, one per deployment under env/:
#
#   docker compose --env-file env/local.env.example up
#   docker compose --env-file .env up -d          # .env: a filled copy of
#                                                 # env/production.env.example
#                                                 # or env/production-external-idp...
#
# The development loop runs the application from source and everything else
# from this file, with the .env.example at the repository root: `npm run dev`
# (scripts/dev.sh, README.md). Its .env also names compose.dev.yaml, which adds
# the one thing only that loop needs: PostgreSQL published on the host.
#
# The env file decides four things. Which Caddy site file is used
# (CADDY_SITES, caddy/Caddyfile), which host ports Caddy is published on
# (HTTP_PORT and HTTPS_PORT), whether Keycloak runs at all
# (COMPOSE_PROFILES=keycloak, absent for an external provider), and where the
# application finds its identity provider (the OIDC_* variables, so that they
# can point at anything).
#
# The service blocks for Caddy, Keycloak and PostgreSQL follow the catalog's
# pipeline blocks; each departure is named where it happens. A value that every
# deployment must set is required here (`:?`), so a missing one stops the start
# and names itself. The few that only one deployment needs are the exception,
# because compose fills in every service of the file, also one that a profile
# leaves out: those are the Keycloak-only variables, and the env file of every
# deployment that runs Keycloak declares them.
#
# It needs Docker Compose 2.20.0 or later, for `required: false` on depends_on.
#
# What must survive is kept in two different ways, on purpose. The published
# artifacts are a bind mount at HANDOUT_ARTIFACTS_DIR: files an operator wants
# to see and copy. Both PostgreSQL data directories and Caddy's certificate store
# are named volumes (postgres-data, keycloak-db-data, caddy-data): a bind mount
# is owned by whoever the host maps it to, and Docker Desktop on macOS and
# Windows maps it to the host user, so PostgreSQL refuses to initialise in it
# ("data directory has wrong ownership", docs/adr/0033). A database is backed up
# with pg_dump in any case, never by copying its files while it runs
# (docs/deployment.md, "What must persist"). The
# container_name values are fixed so `docker ps` on a shared machine says what
# each container is. That rules out two of these side by side on one host, which
# the published ports already do: one host runs one Handout.
name: handout

services:
  # Docker creates a missing bind-mount directory root-owned, while the image
  # runs as the `node` user (uid 1000). This hands it a directory it can write.
  # Runs to completion before the application starts, and is a no-op on every
  # later start.
  data-owner:
    container_name: handout-data-owner
    image: ghcr.io/thorque/handout-app:0.3.0
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R node:node /data"]
    volumes:
      # The published artifacts, one directory per address. Lost with it: every
      # handout's content.
      - "${HANDOUT_ARTIFACTS_DIR:?set the directory the published artifacts are kept in in .env, e.g. /srv/handout/artifacts}:/data"

  postgres:
    container_name: handout-db
    image: postgres:18
    environment:
      POSTGRES_USER: handout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set the application database password in .env}
      POSTGRES_DB: handout
    healthcheck:
      # -h checks over TCP; on the unix socket pg_isready answers during init.
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, handout, -d, handout]
      interval: 5s
      timeout: 5s
      retries: 20
    # A departure from the catalog block, which keeps no volume because a
    # pipeline starts empty every time. Handouts must not be lost.
    volumes:
      # The handouts, their addresses and their passwords. Lost with it: every
      # handout and every address.
      # The mount is the image's VOLUME. PGDATA (/var/lib/postgresql/18/docker)
      # lies below it; the entrypoint runs as root, creates it and hands it to
      # the postgres user.
      - postgres-data:/var/lib/postgresql
    # No `ports:` here. The development loop publishes 5432 on the host's
    # loopback through compose.dev.yaml, which only scripts/dev.sh brings in.
    restart: unless-stopped

  # Keycloak's own database, never the application's: it owns about ninety
  # tables and migrates them on its own upgrade cycle. Only with the bundled
  # Keycloak (profile `keycloak`).
  keycloak-db:
    profiles: [keycloak]
    container_name: handout-keycloak-db
    image: postgres:18
    environment:
      # A departure from the catalog block: the user name is not a secret, so
      # it is fixed here and stays out of .env.
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-}
      POSTGRES_DB: keycloak
    volumes:
      # Keycloak's users, sessions and everything its realm gained at runtime.
      # Lost with it: every publisher's account.
      - keycloak-db-data:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, keycloak, -d, keycloak]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # The bundled identity provider (profile `keycloak`): the trial, the development
  # loop and production with the bundled Keycloak. An external provider leaves the profile off and this service, and
  # its database above, are not started.
  keycloak:
    profiles: [keycloak]
    container_name: handout-keycloak
    image: quay.io/keycloak/keycloak:26.7
    # `start-dev --import-realm` for the local trial, `start --import-realm`
    # for production. start-dev turns the hostname and TLS checks off, which a
    # trial on http://localhost needs and production must not have. The realm
    # is imported on first boot and skipped once it exists.
    command: ${KEYCLOAK_COMMAND:-start --import-realm}
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-}
      # The public URL clients are redirected to, as the browser reaches it.
      KC_HOSTNAME: ${KC_HOSTNAME:-}
      # The browser reaches it directly in the local trial and through Caddy in
      # production, and Caddy forwards the original host and scheme.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-}
      KC_HEALTH_ENABLED: "true"
      # Read by the placeholders in the production realm file at import
      # (keycloak/realm.production.json), so that file pins neither a secret
      # nor a hostname. The local fixture has no placeholders and ignores them.
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set the handout-web client secret in .env}
      HANDOUT_DOMAIN: ${HANDOUT_DOMAIN:?set the publisher domain in .env, e.g. handout.example.com}
    depends_on:
      keycloak-db:
        condition: service_healthy
    volumes:
      # Imported once. A later edit of the file changes nothing: the boot import
      # skips a realm that already exists. Which realm it is comes from the env
      # file: the local fixture with its two users, or the production realm
      # with none.
      - "${KEYCLOAK_REALM_FILE:-./keycloak/realm.production.json}:/opt/keycloak/data/import/realm.json:ro"
    ports:
      # Published on the loopback interface of the host, beside Caddy and not
      # behind it. The local trial needs it: the browser reaches the provider
      # here and the application reaches it at keycloak:8080, which is the
      # two-origin split docs/adr/0005-oidc-two-origins-and-stateless-session.md
      # carries. Production does not use it, as Caddy fronts Keycloak under its
      # own name, and loopback only means nothing outside the machine can reach
      # it either way. A port mapping cannot be switched off by a variable, so
      # it is the same one everywhere.
      - "127.0.0.1:8081:8080"
    healthcheck:
      # The image has no curl; bash opens the socket itself. /health/ready is on
      # the management port and 503s until the realm import is done.
      test:
        [
          CMD-SHELL,
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      # A first start against an empty database builds Keycloak's optimised
      # runtime, creates about ninety tables and imports the realm, which on a
      # cold laptop takes a minute or two, and the 20 retries of 5 s alone are
      # 100 s. Failures inside this window do not count against them, and the
      # first success still marks the service healthy at once, so it costs a
      # fast start nothing. 180 s is a generous multiple of the minute or two
      # expected, chosen to leave room for a slow disk; a Keycloak that is not
      # up by then is broken.
      start_period: 180s
    restart: unless-stopped

  app:
    container_name: handout-app
    # Never `build:`. A pinned version rather than `latest`, so the same
    # product comes up tomorrow as today; "A newer version" in
    # docs/deployment.md says how to move.
    image: ghcr.io/thorque/handout-app:0.3.0
    # The OIDC discovery document is fetched at start, so an application that
    # comes up before the provider is ready aborts, so with the bundled Keycloak
    # the start waits for it to be healthy (see depends_on below). The restart
    # policy is for a provider that goes away later.
    restart: unless-stopped
    environment:
      PORT: "3000"
      # Not 127.0.0.1: Caddy reaches this from another container.
      BIND_ADDRESS: 0.0.0.0
      DATABASE_URL: postgresql://handout:${POSTGRES_PASSWORD:?set the application database password in .env}@postgres:5432/handout
      HANDOUT_DATA_DIR: /data
      MAX_UPLOAD_BYTES: "524288000"
      # The identity provider is whatever the env file says: the bundled
      # Keycloak's values with the bundled one, an existing provider's without.
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?set the issuer as tokens carry it in .env}
      OIDC_BACKCHANNEL_URL: ${OIDC_BACKCHANNEL_URL:?set the issuer as this container reaches it in .env}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set the client id in .env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set the client secret in .env}
      # The value the ID token's roles claim must contain (docs/adr/0034).
      OIDC_REQUIRED_ROLE: ${OIDC_REQUIRED_ROLE:?set the role a publisher needs in .env}
      # True where the only plain-HTTP request is the container-to-container
      # hop to the bundled Keycloak (the back channel of docs/adr/0005) or the
      # whole trial is plain HTTP; false against a provider reachable over HTTPS.
      OIDC_ALLOW_INSECURE_HTTP: ${OIDC_ALLOW_INSECURE_HTTP:?set true or false in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set the session signing secret in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?set true or false in .env}
    healthcheck:
      # The image carries no curl; node fetches its own health route.
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/.handout/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - "${HANDOUT_ARTIFACTS_DIR:?set the directory the published artifacts are kept in in .env, e.g. /srv/handout/artifacts}:/data"
    depends_on:
      postgres:
        condition: service_healthy
      data-owner:
        condition: service_completed_successfully
      # Healthy, not merely started: the discovery document is fetched at
      # start, and Keycloak needs a while on the first start to create its
      # schema and import the realm. Without this gate `docker compose up -d`
      # fails with "dependency failed to start: container handout-app is
      # unhealthy". `required: false` because a deployment without the bundled Keycloak leaves the service out
      # through its profile: Compose then adds no edge instead of refusing the
      # file. It needs Docker Compose 2.20.0 or later.
      keycloak:
        condition: service_healthy
        required: false

  caddy:
    container_name: handout-caddy
    image: caddy:2
    # No `--watch`: the config is fixed for the life of the container.
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    extra_hosts:
      # Docker Desktop resolves host.docker.internal by itself; on Linux it
      # needs this line. Only the development loop uses the name (APP_HOST in
      # its env file), so that Caddy reaches an application running on the host.
      - "host.docker.internal:host-gateway"
    environment:
      # Which file of site blocks under caddy/sites/ this Caddy serves, and the
      # values those files read. Names a deployment does not use are empty, and
      # the file that would read them is not imported.
      CADDY_SITES: ${CADDY_SITES:?set the Caddy site file in .env, e.g. sites/edge.caddyfile}
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-}
      HANDOUT_DOMAIN: ${HANDOUT_DOMAIN:?set the publisher domain in .env, e.g. handout.example.com}
      KEYCLOAK_DOMAIN: ${KEYCLOAK_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:?set the Lets Encrypt contact address in .env}
      # The application's container. The development loop sets APP_HOST to
      # host.docker.internal instead, so that Caddy reaches `npm start` on the host.
      APP_HOST: ${APP_HOST:-app}
      APP_PORT: "3000"
      KEYCLOAK_HOST: keycloak
      KEYCLOAK_PORT: "8080"
    volumes:
      # The directory, not the file: the Caddyfile imports the site files
      # beside it.
      - ./caddy:/etc/caddy:ro
      # Certificates and OCSP staples. Losing it means every certificate is
      # issued again, and that counts against Let's Encrypt's fifty new
      # certificates a week. A named volume, since nobody inspects it by hand.
      - caddy-data:/data
    ports:
      # Caddy always listens on 80 and 443 inside; the env file says where the
      # host reaches them: 80 and 443 in production (port 80 for the ACME
      # HTTP-01 challenge and the redirect to HTTPS, 443/udp is HTTP/3), 8080
      # for the local trial, where 443 has no listener.
      - "${HTTP_PORT:?set the host port for HTTP in .env, 80 in production}:80"
      - "${HTTPS_PORT:?set the host port for HTTPS in .env, 443 in production}:443"
      - "${HTTPS_PORT}:443/udp"
    depends_on:
      app:
        condition: service_healthy
      keycloak:
        condition: service_started
        required: false
    healthcheck:
      # A TCP connect, not an HTTP request: this answers "is Caddy listening",
      # and any HTTP probe would answer for the application instead. Port 80
      # is open in every deployment.
      test: [CMD, nc, -z, localhost, "80"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  # The application's database. A named volume, not a bind mount: see the note
  # at the top. Lost with it: every handout and every address. `docker compose
  # down` keeps it, `down -v` and `docker volume rm` do not.
  postgres-data:
  # Keycloak's database (profile `keycloak`). Lost with it: every account.
  keycloak-db-data:
  # Caddy's certificate store. Lost with it: the two named hosts are obtained
  # again at start, and every handout's certificate when a request for that
  # address next arrives.
  caddy-data:
