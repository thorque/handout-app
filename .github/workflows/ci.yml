name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # PostgreSQL and nothing else: the test suite stands up its own stub
    # OIDC provider in-process (see test/helpers/oidc-stub.js) and never
    # touches Caddy or Keycloak. Bringing up the whole product needs both, but
    # this job is not that — do not add them here "for symmetry" with a
    # deployment; the tests do not need them and would only wait for them.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # test/helpers/app.js reads POSTGRES_URL, not DATABASE_URL — an
      # undocumented thirteenth environment variable the test suite needs
      # that the application itself never does (see .env.example and the
      # README's configuration table for the twelve the application reads).
      # The role has to be allowed to CREATE DATABASE: the suite creates and
      # drops handout_test around every test file. The `postgres` superuser
      # the service starts with already can.
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Before the tests: a leaked tracker key or an internal URL is a
      # one-line fix, and finding it after a green suite is finding it late.
      - run: npm run check:refs
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
